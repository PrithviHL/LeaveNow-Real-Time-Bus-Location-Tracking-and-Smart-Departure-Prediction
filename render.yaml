services:
  - type: web
    name: leavenow-public
    runtime: docker
    plan: free
    region: ohio
    branch: feature/streamlit-containers
    dockerfilePath: deploy/docker/public.Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: STREAMLIT_SERVER_COOKIE_SECRET
        generateValue: true
