apiVersion: apps/v1
kind: Deployment
metadata:
  name: leavenow-streamlit
  labels:
    app: leavenow-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leavenow-streamlit
  template:
    metadata:
      labels:
        app: leavenow-streamlit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamlit
          image: leavenow-streamlit:prototype
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: LEAVENOW_API_URL
              value: http://leavenow-api:3001
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: leavenow-streamlit
spec:
  type: ClusterIP
  selector:
    app: leavenow-streamlit
  ports:
    - name: http
      port: 80
      targetPort: http
