apiVersion: apps/v1
kind: Deployment
metadata:
  name: leavenow-api
  labels:
    app: leavenow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leavenow-api
  template:
    metadata:
      labels:
        app: leavenow-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: leavenow-api:prototype
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: RTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: leavenow-rts
                  key: RTS_API_KEY
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3001"
            - name: ALLOWED_HOSTS
              value: leavenow-api
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: leavenow-api
spec:
  type: ClusterIP
  selector:
    app: leavenow-api
  ports:
    - name: http
      port: 3001
      targetPort: http
