services:
  api:
    image: leavenow-api:prototype
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      RTS_API_KEY: ${RTS_API_KEY:?Set RTS_API_KEY in the root .env file}
      HOST: 0.0.0.0
      PORT: "3001"
      ALLOWED_HOSTS: api
    expose: ["3001"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  streamlit:
    image: leavenow-streamlit:prototype
    build:
      context: .
      dockerfile: deploy/docker/streamlit.Dockerfile
    environment:
      LEAVENOW_API_URL: http://api:3001
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
