version: '3.8'

services:
  ais:
    build:
      context: .
    ports:
      - "8501:8501"  # Map Streamlit to localhost:8501
      - "8000:8000"  # Expose Prometheus metrics on port 8000
    environment:
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - .:/app  # Mount 'ais' directory to '/app' to match Dockerfile WORKDIR
    command: >
      sh -c "streamlit run app2.py --server.port=8501 --server.address=0.0.0.0 && python -m prometheus_client.start_http_server 8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"  # Expose Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Expose Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
