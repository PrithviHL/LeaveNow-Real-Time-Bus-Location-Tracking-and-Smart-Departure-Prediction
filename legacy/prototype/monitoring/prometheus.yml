global:
  scrape_interval: 5s  # How often Prometheus scrapes metrics

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Streamlit app metrics
  - job_name: 'streamlit_app'
    static_configs:
      - targets: ['ais:8000']  # Use the service name 'ais'
