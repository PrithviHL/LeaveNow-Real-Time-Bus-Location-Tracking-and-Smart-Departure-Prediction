name: Continuous integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 scripts/audit-credential-history.py HEAD
      - run: npm run check
      - run: npm run test:coverage
